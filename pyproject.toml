[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goai-virtual-yeast-model"
version = "1.0.0"
description = "Leakage-safe control-anchored low-rank model for yeast proteome perturbation prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Peng Weichao"}
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
